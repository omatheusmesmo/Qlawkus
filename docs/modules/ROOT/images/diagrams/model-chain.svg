<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-labelledby="t d">
  <title id="t">The model chain: primary, secondary, then Ollama</title>
  <desc id="d">A chat request goes to the primary model first. When its retries are exhausted and its circuit breaker opens, the secondary same-provider model answers. If that fails too, the local Ollama fallback answers. A permanent provider error such as 401, 403, 404 or 410 is not handed on and makes readiness report DOWN.</desc>
  <style>
    svg { --bg: #faf8f6; --surface: #ffffff; --text: #232027; --muted: #5f5a64; --border: #b9b2aa;
          --accent: #b85609; --accent-fill: #fdf0e3; --up: #2f7d40; --up-fill: #e8f4ea;
          --danger: #c0392b; --danger-fill: #fdeeec; --note: #3b6fb0; --note-fill: #e9f0f9; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #15131a; --surface: #1d1a23; --text: #ece9f0; --muted: #a9a3b1; --border: #5a5466;
            --accent: #f2a45c; --accent-fill: #3a2a1a; --up: #63c27a; --up-fill: #173222;
            --danger: #ef6f60; --danger-fill: #3a1f1d; --note: #7fa8dc; --note-fill: #1c2a3d; }
    }
    text { font-family: "Manrope", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: var(--text); font-size: 14px; }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
    .small { font-size: 12px; fill: var(--muted); }
    .head { font-weight: 700; font-size: 15px; }
    .box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
    .accent { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.5; }
    .up { fill: var(--up-fill); stroke: var(--up); stroke-width: 1.5; }
    .danger { fill: var(--danger-fill); stroke: var(--danger); stroke-width: 1.5; }
    .note { fill: var(--note-fill); stroke: var(--note); stroke-width: 1.5; }
    .lane { fill: none; stroke: var(--border); stroke-width: 1; stroke-dasharray: 5 4; }
    .line { stroke: var(--muted); stroke-width: 1.6; fill: none; }
    .dash { stroke: var(--muted); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
    .arrow { fill: var(--muted); }
    .c { text-anchor: middle; }
  </style>
  <rect class="box" x="20" y="100" width="130" height="80" rx="10"/>
  <text x="85.0" y="135.0" class="head c">Turn</text>
  <text x="85.0" y="153.0" class="small c">interactive workload</text>
  <rect class="up" x="230" y="100" width="170" height="80" rx="10"/>
  <text x="315.0" y="135.0" class="head c">Primary</text>
  <text x="315.0" y="153.0" class="small c">own breaker + retries</text>
  <rect class="up" x="480" y="100" width="170" height="80" rx="10"/>
  <text x="565.0" y="135.0" class="head c">Secondary</text>
  <text x="565.0" y="153.0" class="small c">same provider, lighter</text>
  <rect class="accent" x="730" y="100" width="150" height="80" rx="10"/>
  <text x="805.0" y="135.0" class="head c">Ollama</text>
  <text x="805.0" y="153.0" class="small c">local last resort</text>
  <line class="line" x1="150" y1="140" x2="230" y2="140"/>
  <polygon class="arrow" points="230,140 220.0,145.0 220.0,135.0"/>
  <line class="line" x1="400" y1="140" x2="480" y2="140"/>
  <polygon class="arrow" points="480,140 470.0,145.0 470.0,135.0"/>
  <text x="440" y="126" class="small c">breaker open</text>
  <line class="line" x1="650" y1="140" x2="730" y2="140"/>
  <polygon class="arrow" points="730,140 720.0,145.0 720.0,135.0"/>
  <text x="690" y="126" class="small c">fails too</text>
  <rect class="danger" x="230" y="230" width="420" height="70" rx="10"/>
  <text x="440.0" y="260.0" class="head c">Permanent error: 401, 403, 404, 410</text>
  <text x="440.0" y="278.0" class="small c">never handed on; readiness DOWN after 3 in a row</text>
  <line class="dash" x1="315" y1="180" x2="315" y2="230"/>
  <polygon class="arrow" points="315,230 310.0,220.0 320.0,220.0"/>
  <line class="dash" x1="565" y1="180" x2="565" y2="230"/>
  <polygon class="arrow" points="565,230 560.0,220.0 570.0,220.0"/>
  <rect class="note" x="230" y="20" width="420" height="50" rx="10"/>
  <text x="440.0" y="49.0" class="c">Batch workload: bulkhead full stops at the primary</text>
  <line class="dash" x1="315" y1="70" x2="315" y2="100"/>
  <polygon class="arrow" points="315,100 310.0,90.0 320.0,90.0"/>
</svg>
