quarkus.http.test-port=0
quarkus.management.test-port=0
quarkus.langchain4j.devservices.enabled=false
quarkus.langchain4j.ollama.devservices.enabled=false
%test.quarkus.langchain4j.openai."primary".api-key=test-key
%test.qlawkus.startup-thought.enabled=false
%test.qlawkus.agent.facts.root=target/mcp-management/facts
%test.qlawkus.agent.episodic.root=target/mcp-management/journals
%test.qlawkus.agent.working-memory.root=target/mcp-management/working-memory
%test.qlawkus.agent.state.root=target/mcp-management/state
%test.qlawkus.skills.roots=target/mcp-management/skills
%test.qlawkus.secrets.keystore-path=target/mcp-management/secrets.p12
%test.qlawkus.secrets.keystore-password=fixture-store-password
qlawkus.mcp.discovery-timeout=3s
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.qlawkus=qlawkus-test
quarkus.security.users.embedded.roles.qlawkus=admin
quarkus.http.auth.basic=true
qlawkus.mcp.allow-private-endpoints=true
