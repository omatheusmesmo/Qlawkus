# Upstream debug/error logs can include subprocess argv, stderr and remote bodies.
quarkus.log.category."dev.langchain4j.mcp".level=OFF
quarkus.log.category."io.quarkiverse.langchain4j.mcp.runtime.http".level=OFF
quarkus.log.category."io.quarkus.oidc.client".level=OFF
quarkus.log.category."io.quarkus.oidc.common".level=OFF
# Connections own their dynamic OAuth clients. An empty registry must not provision a test identity provider.
quarkus.keycloak.devservices.enabled=false
quarkus.oidc-client.client-enabled=false
