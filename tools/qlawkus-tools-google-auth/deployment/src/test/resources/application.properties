quarkus.application.name=qlawkus-google-auth-test

quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.packages=dev.omatheusmesmo.qlawkus.agent.scope,dev.omatheusmesmo.qlawkus.store.pg,dev.omatheusmesmo.qlawkus.cognition
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-at-start=true
quarkus.flyway.baseline-on-migrate=true

quarkus.datasource."google-auth".db-kind=postgresql
quarkus.hibernate-orm."google-auth".datasource=google-auth
quarkus.hibernate-orm."google-auth".packages=dev.omatheusmesmo.qlawkus.tools.google.auth
quarkus.hibernate-orm."google-auth".physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.flyway."google-auth".migrate-at-start=true
quarkus.flyway."google-auth".clean-at-start=true
quarkus.flyway."google-auth".baseline-on-migrate=true
quarkus.flyway."google-auth".locations=db/migration-google-auth

# The browser kickoff endpoint is @Authenticated, so the test needs a realm to log into.
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.qlawkus=qlawkus-test
quarkus.security.users.embedded.roles.qlawkus=admin
quarkus.http.auth.basic=true

qlawkus.google.auth.client-id=test-client-id
qlawkus.google.auth.client-secret=test-client-secret
qlawkus.google.vault.enabled=false
qlawkus.google.vault.encryption-passphrase=test-vault-passphrase

quarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.embedding-model.provider=ollama
quarkus.langchain4j.ollama.chat-model.model-name=test
quarkus.langchain4j.ollama.chat-model.temperature=0
quarkus.langchain4j.ollama.embedding-model.model-name=test
quarkus.langchain4j.ollama.timeout=10s
quarkus.langchain4j.openai.api-key=dummy

%test.qlawkus.startup-thought.enabled=false

quarkus.http.test-port=0
quarkus.wiremock.devservices.enabled=true
quarkus.rest-client.google-device-flow.url=http://localhost:${quarkus.wiremock.devservices.port}
