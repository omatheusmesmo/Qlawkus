quarkus.http.test-port=0
quarkus.wiremock.devservices.enabled=true
%test.qlawkus.agent.state.root=target/qlawkus-test/state
qlawkus.self-observe.enabled=true
qlawkus.self-observe.prometheus-url=http://localhost:${quarkus.wiremock.devservices.port}/prom/
qlawkus.self-observe.tempo-url=http://localhost:${quarkus.wiremock.devservices.port}/tempo
qlawkus.self-observe.loki-url=http://localhost:${quarkus.wiremock.devservices.port}/loki
qlawkus.self-observe.max-window=6h
qlawkus.self-observe.max-results=3
qlawkus.self-observe.max-chars=4000
qlawkus.self-observe.timeout=1s
