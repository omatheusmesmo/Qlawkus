# Replaces /otel-lgtm/prometheus.yaml in grafana/otel-lgtm. Everything above scrape_configs is the
# image's own file, kept verbatim so OTLP ingestion behaves as upstream ships it; re-copy it when the
# image tag in docker-compose.yml moves. The one addition is the scrape job for the agent.
---
global:
  scrape_native_histograms: true
otlp:
  keep_identifying_resource_attributes: true
  # Recommended attributes to be promoted to labels.
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - cloud.availability_zone
    - cloud.region
    - container.name
    - deployment.environment # backward compatibility
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - database # used by otelcol/receiver/mongodb
    - kafka.cluster.alias
storage:
  tsdb:
    # A 10min time window is enough because it can easily absorb retries and network delays.
    out_of_order_time_window: 10m

scrape_configs:
  # The agent serves /q/metrics on its management interface (port 9000), which Compose never
  # publishes, so this scrape needs no credential and the public port serves no metrics at all.
  # "agent" is a network alias both the JVM and the native service carry; only one runs at a time.
  - job_name: qlawkus
    scrape_interval: 15s
    metrics_path: /q/metrics
    static_configs:
      - targets:
          - agent:9000
