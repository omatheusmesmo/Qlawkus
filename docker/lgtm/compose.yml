# The observability backend every Compose stack brings up next to the agent: grafana/otel-lgtm, one
# container holding an OpenTelemetry Collector, Prometheus, Tempo, Loki and Grafana. Both
# docker-compose files pull this service in with `extends`, so it is defined once.
#
# Upstream describes the image as meant for development, demo and testing, and points production at a
# managed backend. Qlawkus is single-instance by design, so one container on the same host is a fair
# fit; a deployment that outgrows it points QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT at its own collector
# and scrapes port 9000 from its own Prometheus, with no change to the agent.
services:
  lgtm:
    image: grafana/otel-lgtm:0.38.0
    environment:
      # The image grants every anonymous visitor the Admin role. Turned off here, and the admin
      # password is required: the entrypoint below refuses to start Grafana without one, the same
      # fail-closed stance the agent takes on its own admin credential. Grafana reads this only when it
      # first creates its database under /data, so changing it later takes the CLI (the command is in
      # site/content/operations.adoc, "The bundled stack").
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/otel-lgtm/qlawkus-dashboards/qlawkus-agent.json
    entrypoint:
      - sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "Set GRAFANA_ADMIN_PASSWORD in .env: Grafana will not start with its default admin/admin." >&2
          exit 1
        fi
        exec /otel-lgtm/run-all.sh
    volumes:
      - lgtm-data:/data
      - ./prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/qlawkus.yaml:ro
      - ../../examples/observability/grafana/qlawkus-agent.json:/otel-lgtm/qlawkus-dashboards/qlawkus-agent.json:ro
    # Only Grafana is published. OTLP (4317/4318) and the backends' own APIs stay on the Compose
    # network, where the agent sends to them and Prometheus scrapes the agent.
    expose:
      - "4317"
      - "4318"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  lgtm-data:
    name: qlawkus_lgtm-data
