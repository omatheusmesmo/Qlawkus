name: Docs Preview Build

# Builds the Roq static site for a PR and uploads it as an artifact.
# Runs on the untrusted pull_request trigger, so it must NOT use any secret:
# the deploy (docs-preview-deploy.yml) picks the artifact up in a trusted context.
on:
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - '**/runtime/**/*.java'
      - 'scripts/*docs*'
      - '.github/workflows/docs-preview-build.yml'

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - id: m2
        name: Restore the Maven repository
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-build-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            m2-${{ runner.os }}-build-
            m2-${{ runner.os }}-

      # Build the extensions so the config-doc metadata (from @ConfigMapping JavaDoc)
      # is available in the local repository.
      - name: Build extensions
        run: mvn -B -ntp install -DskipTests

      - name: Test the docs navigation generator and drift check
        run: scripts/test-docs-nav.sh

      # Generate the config reference into site/content/includes, the navigation into site/data and
      # docs/modules/ROOT/nav.adoc, and mirror site/content into docs/ (the verify phase).
      - name: Generate config reference, navigation and mirror
        run: mvn -B -ntp -f docs/pom.xml verify -DskipTests

      - name: Check generated documentation files are committed
        run: scripts/check-docs-drift.sh

      # Generate the static site into site/target/roq. SITE_PATH_PREFIX is empty
      # because Surge serves the preview at the domain root.
      - name: Generate static site
        env:
          QUARKUS_ROQ_GENERATOR_BATCH: 'true'
          SITE_PATH_PREFIX: ''
          SITE_URL: https://qlawkus-docs-${{ github.event.number }}-preview.surge.sh
        run: mvn -B -ntp -f site/pom.xml package quarkus:run -DskipTests

      - name: Store PR id
        run: echo ${{ github.event.number }} > site/target/roq/pr-id.txt

      - name: Upload site artifact
        uses: actions/upload-artifact@v6
        with:
          name: docs-site
          path: site/target/roq
          retention-days: 3
