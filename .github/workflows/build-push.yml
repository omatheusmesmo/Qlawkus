name: Build (on push)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build on main
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: dummy
    steps:
      - uses: actions/checkout@v7

      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - id: m2
        name: Restore the Maven repository
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2
          key: m2-${{ runner.os }}-build-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          restore-keys: |
            m2-${{ runner.os }}-build-
            m2-${{ runner.os }}-

      - name: Build with Maven
        run: ./mvnw -B clean install -Dci=true -Dno-format -ntp

      - name: Live provider contract
        env:
          LLM_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_KIND: nvidia
        run: ./mvnw -B test -pl integration-tests/live-provider -Dci=true -Dno-format -ntp

      - name: Save the Maven repository
        if: success() && github.ref_name == github.event.repository.default_branch && steps.m2.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2
          key: ${{ steps.m2.outputs.cache-primary-key }}

      - name: Upload test reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-reports
          path: '**/target/*-reports/TEST-*.xml'
          retention-days: 7
