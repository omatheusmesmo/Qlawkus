name: Publish images

run-name: Publish images ${{ inputs.version }}

# Builds the JVM and native container images in-container (the Dockerfiles compile the reactor
# themselves, so no host Maven step is needed) and pushes them to GHCR. Both are the image
# composition: they run on files with no database and switch to Postgres when a datasource is
# configured, and carry the Google Workspace and Brag tools, whose databases stay off until their URL
# is given. The devtools variant (git and gh) is built from source (QLAWKUS_IMAGE_VARIANT=devtools). Called by
# release-perform.yml with the release tag; dispatch it by hand on a branch to rehearse the build
# (push defaults to false, so nothing leaves the runner).

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to tag the images with (a release tag such as 0.10.0, or dev)'
        required: true
        type: string
      ref:
        description: 'Git ref to build (the release tag); defaults to the triggering ref'
        required: false
        type: string
        default: ''
      push:
        description: 'Push to GHCR (false builds only)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag the images with (dev builds are never tagged latest)'
        required: true
        default: dev
        type: string
      ref:
        description: 'Git ref to build; defaults to the selected branch'
        required: false
        type: string
        default: ''
      push:
        description: 'Push to GHCR (false builds only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Resolve tags
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.resolve.outputs.owner }}
      version: ${{ steps.resolve.outputs.version }}
      release: ${{ steps.resolve.outputs.release }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_PUSH: ${{ inputs.push }}
    steps:
      - id: resolve
        name: Resolve owner, version and release flag
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid image version: ${VERSION}" >&2
            exit 1
          fi
          RELEASE=false
          if [[ "${INPUT_PUSH}" == "true" && "${VERSION}" != *-SNAPSHOT && "${VERSION}" != "dev" ]]; then
            RELEASE=true
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "owner=${OWNER}"
            echo "version=${VERSION}"
            echo "release=${RELEASE}"
          } >> "${GITHUB_OUTPUT}"
          echo "Images: ghcr.io/${OWNER}/qlawkus:${VERSION} (latest tags: ${RELEASE})"

  images:
    name: Image ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: jvm
            dockerfile: app/src/main/docker/Dockerfile.jvm-build
            build-args: |
              QLAWKUS_IMAGE_VARIANT=base
              QLAWKUS_COMPOSITION=image
            suffix: ''
          - name: native
            dockerfile: app/src/main/docker/Dockerfile.native-build
            build-args: QLAWKUS_COMPOSITION=image
            suffix: -native
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - id: source
        name: Record the commit being built
        run: echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Reclaim Disk Space
        run: .github/ci-prerequisites.sh

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.prepare.outputs.owner }}/qlawkus
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}${{ matrix.suffix }}
            type=raw,value=latest${{ matrix.suffix }},enable=${{ needs.prepare.outputs.release }}
          labels: |
            org.opencontainers.image.title=Qlawkus
            org.opencontainers.image.description=Qlawkus: autonomous personal engineering agent built on Quarkus
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No GHA layer cache: both Dockerfiles COPY the whole repository before compiling, so every commit
      # invalidates every layer that matters (a native build reuses 2 of them), while the blobs written
      # under a tag or a branch ref are unreadable from any other ref and filled the 10 GB repository quota.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          push: ${{ inputs.push }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke boot without a database or a .env
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          # The shell runs with pipefail, and grep -q (or head) leaves a pipe as soon as it matches, so
          # `docker logs | grep -q` fails with SIGPIPE whenever the log is longer than the pipe buffer, even
          # though the line is there. Each check therefore reads a snapshot file.
          snapshot() { docker logs "$1" > "${RUNNER_TEMP}/$1.log" 2>&1; }
          logged() { snapshot "$1"; grep -q -E "$2" "${RUNNER_TEMP}/$1.log"; }
          IMAGE="$(head -n1 <<< "${IMAGE}")"
          docker run -d --name qlawkus-smoke -p 8742:8080 "${IMAGE}"
          for _ in $(seq 1 90); do
            if logged qlawkus-smoke "setup token"; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8742/q/health/live
          logged qlawkus-smoke "setup token" \
            || { cat "${RUNNER_TEMP}/qlawkus-smoke.log"; echo "no setup token in the log" >&2; exit 1; }
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8742/console/first-run)"
          [ "${status}" = "200" ] || { echo "first-run page answered ${status}" >&2; exit 1; }
          token="$(grep -o -m1 'setup token [A-Za-z0-9_-]*' "${RUNNER_TEMP}/qlawkus-smoke.log" | awk '{print $3}')"
          password="smoke-test-password-1"
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8742/console/first-run \
            -d "token=${token}" --data-urlencode "password=${password}" --data-urlencode "confirm=${password}")"
          [ "${status}" = "200" ] || { echo "setting the password answered ${status}" >&2; exit 1; }
          docker exec qlawkus-smoke test -f /home/default/.qlawkus/secrets.p12 \
            || { snapshot qlawkus-smoke; grep -E "instance lock on" "${RUNNER_TEMP}/qlawkus-smoke.log" >&2; echo "the keystore is not under /home/default, so it would not survive a new container" >&2; exit 1; }
          curl -s -o /dev/null -m 60 -u "qlawkus:${password}" -X POST http://localhost:8742/api/chat/sync \
            -H 'Content-Type: application/json' -d '{"message":"ping"}' || true
          if logged qlawkus-smoke "is not writable|Error injecting"; then
            grep -m3 -E "is not writable|Error injecting" "${RUNNER_TEMP}/qlawkus-smoke.log" >&2
            echo "an agent turn failed before reaching the model" >&2
            exit 1
          fi
          # What a native image says when it lacks a reflection registration: the JVM image never does.
          native_failure="MissingReflectionRegistrationError|CreationException|No agent method found|no default \(no arg\) constructor"
          if logged qlawkus-smoke "${native_failure}"; then
            grep -m3 -E "${native_failure}" "${RUNNER_TEMP}/qlawkus-smoke.log" | cut -c1-400 >&2
            echo "the image reports a missing reflection registration or a bean it cannot create" >&2
            exit 1
          fi
          docker rm -f qlawkus-smoke
          docker run -d --name qlawkus-uid --user 4321:0 "${IMAGE}"
          for _ in $(seq 1 90); do
            if logged qlawkus-uid "instance lock on"; then break; fi
            sleep 2
          done
          logged qlawkus-uid "instance lock on /home/default/.qlawkus" \
            || { grep -E "instance lock on" "${RUNNER_TEMP}/qlawkus-uid.log" >&2; echo "with another uid the state is not under /home/default" >&2; exit 1; }
          docker rm -f qlawkus-uid
