version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 5
  labels:
  - ci
  - dependencies

# Image tags in the Compose stacks. Bumping grafana/otel-lgtm also means re-copying the image's
# prometheus.yaml into docker/lgtm/prometheus.yaml (see the header there). Bumping pgvector/pgvector
# to another PostgreSQL major needs scripts/migrate-postgres.sh first: a major cannot read another's
# data files. Tags are pinned to an exact version on purpose so these updates are reviewable.
- package-ecosystem: docker-compose
  directories:
  - /
  - /docker/lgtm
  - /docker/searxng
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  labels:
  - dependencies

# Base images of the in-container builds (UBI OpenJDK, UBI minimal, the Mandrel builder).
- package-ecosystem: docker
  directory: /app/src/main/docker
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  labels:
  - dependencies
  ignore:
  - dependency-name: quarkus/ubi10-quarkus-mandrel-builder-image
    update-types:
    - version-update:semver-major

- package-ecosystem: maven
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 5
  labels:
  - dependencies
  ignore:
  - dependency-name: io.quarkus:*
  # Test-scope only, in composition-maven-plugin, and pinned to whatever Maven itself
  # ships so the test classpath matches the runtime the plugin executes in.
  # Maven 3.10.x carries slf4j-api 2.0.x; this tracks maven.version, not upstream slf4j.
  - dependency-name: org.slf4j:*
