version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 5
  labels:
  - ci
  - dependencies

# Image tags in the Compose stacks. Bumping grafana/otel-lgtm also means re-copying the image's
# prometheus.yaml into docker/lgtm/prometheus.yaml (see the header there).
- package-ecosystem: docker-compose
  directories:
  - /
  - /docker/lgtm
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  labels:
  - dependencies

- package-ecosystem: maven
  directory: /
  schedule:
    interval: daily
  open-pull-requests-limit: 5
  labels:
  - dependencies
  ignore:
  - dependency-name: io.quarkus:*
  # Test-scope only, in composition-maven-plugin, and pinned to whatever Maven itself
  # ships so the test classpath matches the runtime the plugin executes in.
  # Maven 3.9.x carries slf4j-api 1.7.x; this tracks maven.version, not upstream slf4j.
  - dependency-name: org.slf4j:*
