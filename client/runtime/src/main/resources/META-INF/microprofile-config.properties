# langchain4j-agentic logs WARN "Improper invocation of a standalone agent outside of an agentic system"
# on every messaging turn, repeating the same advice each time and burying the warnings that need attention.
# Only that category is quieted, and at ERROR: its errors still show, and so does every other logger.
# To see the warning again, set this category level back to WARN.
quarkus.log.category."dev.langchain4j.agentic.agent.AgentInvocationHandler".level=ERROR

# Classification has separate provider breakers and admission from owner turns and extraction jobs.
qlawkus.model.workload.decision.max-concurrent=2
qlawkus.model.workload.decision.fallback-on-reject=false
