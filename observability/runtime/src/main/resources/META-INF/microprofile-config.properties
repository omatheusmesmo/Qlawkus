# Upstream ships the OpenTelemetry SDK enabled with the traces exporter defaulting to OTLP on
# localhost:4317. Selecting this capability with no collector listening would then produce a loop of
# export failures for someone who only wanted metrics, so the SDK starts off and is turned on once a
# collector exists. Both properties below are RUN_TIME, so that is a runtime toggle and not a rebuild:
#
#   PUT /api/admin/runtime-toggles  quarkus.otel.sdk.disabled=false
#   PUT /api/admin/runtime-toggles  quarkus.otel.exporter.otlp.endpoint=http://collector:4317
#
# Metrics need no such gate: a Prometheus registry only exposes a scrape endpoint and reaches out to
# nothing, so it is useful the moment the capability is selected.
quarkus.otel.sdk.disabled=true

# Ships log records over the same OTLP pipe as traces once the SDK is on, each stamped with the trace
# and span it was logged under, so a collector can join a log line to its turn without parsing the
# console. Build time (BUILD_AND_RUN_TIME_FIXED), so it is set here rather than left to a deployment;
# it is inert while the SDK above is disabled.
quarkus.otel.logs.enabled=true

# quarkus-logging-json switches the console to JSON in every profile. That is what a container log
# pipeline wants, and nothing a person reading `quarkus:dev` or a test run wants, so those two keep
# the plain format. Both are RUN_TIME, so a deployment can still turn JSON off without a rebuild.
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
