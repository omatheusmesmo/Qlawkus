# Isolated test distribution: fixture credentials only; no provider or live agent is contacted.
quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.qlawkus=qlawkus-test
quarkus.security.users.embedded.roles.qlawkus=admin
quarkus.http.auth.basic=true
quarkus.http.test-port=0
quarkus.management.test-port=0
quarkus.scheduler.enabled=false
qlawkus.startup-thought.enabled=false
qlawkus.agent.facts.root=target/mcp-console/facts
qlawkus.agent.episodic.root=target/mcp-console/journals
qlawkus.agent.working-memory.root=target/mcp-console/working-memory
qlawkus.agent.state.root=target/mcp-console/state
qlawkus.skills.roots=target/mcp-console/skills
qlawkus.secrets.keystore-path=target/mcp-console/secrets.p12
qlawkus.secrets.keystore-password=fixture-password
quarkus.langchain4j.openai."primary".base-url=http://127.0.0.1:1/v1
quarkus.langchain4j.openai."primary".api-key=fixture-key
qlawkus.embedding.base-url=http://127.0.0.1:1/v1
qlawkus.embedding.api-key=fixture-key
