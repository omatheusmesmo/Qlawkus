quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.qlawkus=qlawkus-test
quarkus.security.users.embedded.roles.qlawkus=admin
quarkus.http.auth.basic=true

# Deliberately no mock-mode and no base-url/api-key override: the provider is resolved from the
# LLM_* environment exactly as in a deployment, so QlawkusTestUtils#usesLLM is true only when a real
# key is present. Only the file roots are pinned, under target/, so the run never touches ~/.qlawkus.
%test.qlawkus.startup-thought.enabled=false
%test.qlawkus.agent.facts.root=target/live-provider/facts
%test.qlawkus.agent.episodic.root=target/live-provider/journals
%test.qlawkus.agent.working-memory.root=target/live-provider/working-memory
%test.qlawkus.agent.state.root=target/live-provider/state
%test.qlawkus.skills.roots=target/live-provider/skills

# The primary is slow on a large prompt (tens of seconds, up to ~90s), and the client default
# would cut the call before the contract test's own @Timeout. Both chat tiers get the same budget.
%test.quarkus.langchain4j.openai."primary".timeout=240s
%test.quarkus.langchain4j.openai."secondary".timeout=240s
