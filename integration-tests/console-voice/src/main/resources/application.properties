quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.qlawkus=qlawkus-test
quarkus.security.users.embedded.roles.qlawkus=admin
quarkus.http.auth.basic=true

%test.qlawkus.startup-thought.enabled=false
%test.qlawkus.agent.semantic-extractor.enabled=false
%test.qlawkus.skills.extractor.enabled=false
%test.qlawkus.agent.facts.root=target/console-voice/facts
%test.qlawkus.agent.episodic.root=target/console-voice/journals
%test.qlawkus.agent.working-memory.root=target/console-voice/working-memory
%test.qlawkus.agent.state.root=target/console-voice/state
%test.qlawkus.skills.roots=target/console-voice/skills
%test.qlawkus.runtime.override-path=target/console-voice/agent.runtime.yml
%test.qlawkus.secrets.keystore-path=target/console-voice/secrets.p12
%test.qlawkus.secrets.keystore-password=testpass

%test.qlawkus.messaging.tts.enabled=false
%test.qlawkus.console.voice.max-utterance-bytes=4000
%test.qlawkus.console.voice.max-frame-bytes=2048
%test.qlawkus.console.voice.max-queued-segments=2

%test.quarkus.wiremock.devservices.enabled=true
%test.quarkus.langchain4j.devservices.enabled=false
%test.quarkus.langchain4j.ollama.devservices.enabled=false
%test.quarkus.langchain4j.ollama.timeout=300s
%test.quarkus.langchain4j."primary".chat-model.provider=ollama
%test.quarkus.langchain4j.ollama."primary".chat-model.model-name=gemma4:e2b
%test.quarkus.langchain4j.ollama."primary".base-url=http://localhost:${quarkus.wiremock.devservices.port}
%test.quarkus.langchain4j.ollama.base-url=http://localhost:${quarkus.wiremock.devservices.port}
%test.quarkus.langchain4j.ollama."fallback".base-url=http://localhost:${quarkus.wiremock.devservices.port}
%test.quarkus.langchain4j.openai."primary".base-url=http://localhost:${quarkus.wiremock.devservices.port}/v1
%test.quarkus.langchain4j.openai."primary".api-key=test-key
%test.qlawkus.reply-language.enabled=true
%test.qlawkus.model.retry-max-attempts=2
%test.qlawkus.model.retry-initial-delay=10ms
%test.qlawkus.model.retry-max-delay=20ms
